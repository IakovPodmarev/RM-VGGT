[project]
authors = [{name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"}]
dependencies = [
    "numpy>=1.26,<2",
    "pillow",
    "huggingface-hub",
    "einops",
    "safetensors",
    "opencv-python", "iopath>=0.1.10,<0.2", "wcmatch>=10.2.1,<11",
]
name = "vggt"
requires-python = ">= 3.10"
version = "0.0.1"

[project.optional-dependencies]
demo = [
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "opencv-python",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
    "matplotlib",
]

# Using setuptools as the build backend
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# setuptools configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*"]

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.2" }]

[tool.pixi.feature.test.pypi-dependencies]
hydra-core = "*"
omegaconf = "*"

[tool.pixi.environments]
default = { features = ["info", "test"] }
demo = { features = ["demo"] }

[tool.pixi.pypi-dependencies]
onnx = ">=1.16.0, <2"
torchviz = ">=0.0.2, <0.1"

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "1.26.*"
pillow = ">=8,<12"
markupsafe = ">=2,<3"
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.2.*"
graphviz = "*"
setuptools = ">=82.0.1,<83"
pip = ">=26.1.1,<27"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.0,<5"
ruff = ">=0.15.20,<0.16"

[tool.pixi.feature.info.pypi-dependencies]
torchinfo = "*"
