defaults:
  - default_dataset.yaml
  - _self_

exp_name: e01a
img_size: 518
accum_steps: 1
max_img_per_gpu: 1
batch_size: 1
episode_batch_size: 1

e01a:
  experiment_id: E01a
  total_frames: 24
  segment_frames: 8
  num_segments: 3
  backprop_mode: full
  memory_enabled: true
  frozen_aggregator: true
  batch_size: 1
  episode_batch_size: 1

model:
  enable_camera: true
  enable_depth: true
  enable_point: false
  enable_track: false

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: l1
  depth:
    weight: 1.0
    gradient_loss_fn: grad
    valid_range: 0.98
  point: null
  track: null

optim:
  optimizer:
    _target_: torch.optim.AdamW
    weight_decay: 0.05
  amp:
    enabled: true
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: [memory_writer, camera_read_adaptor, depth_read_adaptor, camera_head, depth_head]
        max_norm: 1.0
        norm_type: 2
  learning_rates:
    recurrent_memory: 1.0e-4
    prediction_heads: 5.0e-5
  scheduler:
    warmup_fraction: 0.05
    type: cosine
