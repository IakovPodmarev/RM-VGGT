defaults:
  - _self_

exp_name: e01a
experiment_id: ${e01a.experiment_id}
trainer_target: recurrent_trainer.RecurrentTrainer
device: cuda
seed_value: 42
max_epochs: 20
img_size: 518
accum_steps: 1
max_img_per_gpu: 1
batch_size: 1
episode_batch_size: 1

e01a:
  experiment_id: E01a
  total_frames: ${frame_product:${e01a.segment_frames},${e01a.num_segments}}
  segment_frames: 3
  num_segments: 3
  backprop_mode: full
  memory_enabled: true
  frozen_aggregator: true
  batch_size: 1
  episode_batch_size: 1

sequence:
  total_frames: ${e01a.total_frames}
  segment_frames: ${e01a.segment_frames}
  num_segments: ${e01a.num_segments}
  backprop_mode: ${e01a.backprop_mode}

training:
  max_episodes_per_epoch: 800
  episode_batch_size: 1
  accum_steps: 1
  scheduled_updates: 16000

validation:
  max_episodes_per_epoch: 400

vkitti_root: null

episode_sources:
  train:
    _target_: data.datasets.vkitti_sequence.SequentialVKittiEpisodeSource
    dataset_root: ${vkitti_root}
    scenes: ${dataset_split.train}
    training: true
    seed: ${seed_value}
    total_frames: ${sequence.total_frames}
    image_size: ${img_size}
  validation:
    _target_: data.datasets.vkitti_sequence.SequentialVKittiEpisodeSource
    dataset_root: ${vkitti_root}
    scenes: ${dataset_split.validation}
    training: false
    seed: ${seed_value}
    total_frames: ${sequence.total_frames}
    image_size: ${img_size}

dataset_split:
  train: [Scene01, Scene02, Scene06, Scene18]
  validation: [Scene20]

memory:
  enabled: true
  read_slots_per_type: 8
  width: 512
  writer_keep_gate_initial: 0.33
  adaptor_residual_gate_initial: 0.1

model:
  _target_: vggt.models.RMVGGT.RMVGGT
  img_size: ${img_size}
  segment_frames: ${sequence.segment_frames}
  enable_camera: true
  enable_depth: true
  enable_point: false
  enable_track: false

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: l1
  depth:
    weight: 1.0
    gradient_loss_fn: grad
    valid_range: 0.98
  point: null
  track: null

optim:
  optimizer:
    _target_: torch.optim.AdamW
    weight_decay: 0.05
  amp:
    enabled: true
    amp_dtype: bfloat16
    init_scale: 65536.0
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: [memory_writer, camera_read_adaptor, depth_read_adaptor, camera_head, depth_head]
        max_norm: 1.0
        norm_type: 2
  learning_rates:
    recurrent_memory: 1.0e-4
    prediction_heads: 5.0e-5
  scheduler:
    warmup_fraction: 0.05
    type: cosine

logging:
  mode: online
  project: rm-vggt
  run_name: ${exp_name}

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  resume_checkpoint_path: null
  pretrained_checkpoint_path: null
